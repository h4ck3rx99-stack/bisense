# Tier B: official public BIS pages that `bisense fetch-public` may download.
#
# Rules (see docs/DATA.md):
#   - Only official domains (bis.gov.in). Never follow URLs found inside fetched content.
#   - robots.txt of www.bis.gov.in (checked 2026-09-27) disallows only /wp-admin/.
#   - One request every few seconds; stop on any HTTP error.
#   - Each downloaded file is recorded in data/sources.yaml with URL and retrieval date.
#
# Fields: file (name under data/public/), url, title, category, doc_type
#   doc_type: guidance_page (BIS service information) | catalogue_page (list of products + IS numbers)
#             | government_order (Quality Control Order PDF)

