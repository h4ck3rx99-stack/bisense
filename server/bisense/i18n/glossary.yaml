# products: everyday product words -> the product name used in the official BIS compulsory-certification
#   lists / product manuals. Used for matching list rows: the everyday words are REPLACED by the official
#   wording before comparing ("LED bulbs" -> "self-ballasted LED lamps general lighting", so the row for
#   IS 16102 wins over "LED hand lamps"), and the official wording is added to the keyword search.
#   The longest matching key wins. Every right-hand side was checked against a row or manual in data/public.
