# BISense glossary.
#
# synonyms: expand the LEXICAL (BM25) query only. Left side is what users type; right side is how
#           standards and BIS pages phrase it. Keep this small and curated.
# keywords_hi / keywords_kn: offline fallback used ONLY when no LLM is available to translate a
#           Hindi/Kannada query. Each entry maps a word (or stem) to English search terms.
#           Native speakers: please review (see docs/TEAM_GUIDE.md).
# do_not_translate: terms that must stay exactly as written when answers are translated.

