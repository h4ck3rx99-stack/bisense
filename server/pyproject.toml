[project]
name = "bisense"
version = "0.1.0"
description = "BISense: evidence-first assistant for Indian Standards and BIS services"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "pymupdf",
    "fastembed",
    "numpy",
    "typer",
    "pyyaml",
    "beautifulsoup4",
    "fpdf2",
    "python-multipart",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
bisense = "bisense.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bisense"]
