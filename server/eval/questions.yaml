# BISense evaluation set.
#
# Every answerable question was drafted by reading an ingested clause (origin: auto_drafted) and
# records where the answer lives. The team should spot-check these (docs/TEAM_GUIDE.md).
#
# Fields
#   id         unique id
#   q          the question as a user would ask it (typos included on purpose in some)
#   lang       en | hi | kn
#   type       answerable | unanswerable | exact | compare | followup
#   expect     list of acceptable evidence locations: {slug, clause?}; a hit = any retrieved chunk from that
#              document (and clause, when given; clause prefixes like "4.3" also match "4.3.1")
#   fact       a short verbatim fragment the correct answer should contain (checked in live mode)
#   context    for follow-ups: the client context sent with the question
#   origin     auto_drafted | team_verified

