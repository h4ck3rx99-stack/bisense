# Questions for the demo (docs/DEMO_SCRIPT.md). `npm run warm` runs each one through the REAL live
# pipeline and stores the validated result in the answer cache (source = warmed), so the demo still
# works if the internet or the LLM provider fails. Cached answers are pipeline outputs, never hand-written.
#
# context: sent like the browser does for follow-ups (previous questions + focused standards).

# Default data mode is OFFICIAL (DATASET=official): these questions use official BIS documents only
# (product manuals, compulsory-certification lists, BIS service pages). Run `npm run fetch-public` and
# `npm run ingest` first.
questions:
  - q: I manufacture plastic food containers. What BIS standards are relevant to me?   # J1 discover
    lang: en
  - q: Is BIS certification compulsory for two-wheeler helmets?      # J2 is there a standard / is it compulsory
    lang: en
  - q: Explain IS 4151 in simple language.                           # J3 explain this standard
    lang: en
    context: {open_slug: is-4151-2015, focus_slugs: [is-4151-2015], recent_questions: ["summary"]}
  - q: What are the important requirements?                          # J4 follow-up inherits the standard
    lang: en
    context: {recent_questions: ["Explain IS 4151 in simple language."], focus_slugs: [is-4151-2015]}
  - q: What requirements apply to my product?                        # clarification path
    lang: en
  - q: How can I check that gold jewellery is hallmarked?            # BIS services: hallmarking
    lang: en
  - q: Where can I get my product tested for BIS certification?      # BIS services: labs
    lang: en
  - q: पैकेज्ड पेयजल के लिए कौन-से BIS मानक लागू होते हैं?            # Hindi
    lang: hi
  - q: ಚಿನ್ನದ ಆಭರಣಕ್ಕೆ ಹಾಲ್‌ಮಾರ್ಕ್ ಹೇಗೆ ಪರಿಶೀಲಿಸುವುದು?                # Kannada
    lang: kn
  - q: What is the fine for selling uncertified helmets in Karnataka?  # J6 honest refusal
    lang: en

summaries: [is-4151-2015, is-1786-2008, is-10910-1984]
compare_pairs:
  - [is-4151-2015, is-2925-1984]   # two-wheeler helmets vs industrial safety helmets (both official manuals)
